name: Deploy CardCollector

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Run C# tests
        if: "!(github.ref == 'refs/heads/main' && github.event_name == 'push')"
        run: dotnet test CardCollector.Tests/CardCollector.Tests.csproj --configuration Release

      - name: Run C# tests with coverage
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: dotnet test CardCollector.Tests/CardCollector.Tests.csproj --configuration Release --logger trx -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura -p:CoverletOutput=./coverage/

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install JS dependencies
        run: npm ci

      - name: Run JS tests
        if: "!(github.ref == 'refs/heads/main' && github.event_name == 'push')"
        run: npm test

      - name: Run JS tests with coverage
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npx vitest run --coverage --reporter=default --reporter=json --outputFile.json=coverage/test-report.json

      - name: Update README coverage block
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        run: ./.github/scripts/Update-ReadmeCoverage.ps1

      - name: Commit README if changed
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if git diff --quiet -- README.md; then
            echo "No README changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: update test counts and coverage in README [skip ci]"
            git push
          fi

  deploy:
    needs: test
    # Only deploy on a push landing on main (or a manual dispatch) — pull_request runs the
    # test job for PR feedback but must never touch the deploy secrets/server.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish CardCollector.csproj -c Release -o publish

      - name: Write private appsettings
        env:
          APPSETTINGS_PRIVATE_JSON: ${{ secrets.APPSETTINGS_PRIVATE_JSON }}
        run: printf '%s' "$APPSETTINGS_PRIVATE_JSON" > appsettings-private.json

      - name: Configure SSH
        env:
          LINODE_SSH_KEY: ${{ secrets.LINODE_SSH_KEY }}
          LINODE_KNOWN_HOSTS: ${{ secrets.LINODE_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$LINODE_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$LINODE_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Stop the service before touching any files on disk. Copying a new build over a running
      # process's files causes it to crash mid-request (BadImageFormatException / core dump) when
      # the runtime tries to JIT a code path from the now half-overwritten assembly, which can hang
      # incoming requests (including login) for up to a minute until systemd kills and restarts it.
      - name: Stop service
        env:
          LINODE_USER: ${{ secrets.LINODE_USER }}
          LINODE_HOST: ${{ secrets.LINODE_HOST }}
        run: ssh -i ~/.ssh/deploy_key "$LINODE_USER@$LINODE_HOST" "sudo systemctl stop card-collector.service"

      # Never touches Data/ - scp only adds/overwrites files present in the publish output,
      # it does not delete or sync anything else on the remote (no --delete, no rsync).
      - name: Deploy application files
        env:
          LINODE_USER: ${{ secrets.LINODE_USER }}
          LINODE_HOST: ${{ secrets.LINODE_HOST }}
        run: scp -i ~/.ssh/deploy_key -r publish/* "$LINODE_USER@$LINODE_HOST:/var/www/card-collector/"

      - name: Deploy private configuration
        env:
          LINODE_USER: ${{ secrets.LINODE_USER }}
          LINODE_HOST: ${{ secrets.LINODE_HOST }}
        run: scp -i ~/.ssh/deploy_key appsettings-private.json "$LINODE_USER@$LINODE_HOST:/var/www/card-collector/appsettings-private.json"

      - name: Start service
        env:
          LINODE_USER: ${{ secrets.LINODE_USER }}
          LINODE_HOST: ${{ secrets.LINODE_HOST }}
        run: ssh -i ~/.ssh/deploy_key "$LINODE_USER@$LINODE_HOST" "sudo systemctl start card-collector.service"
